[project]
name = "rootcause-agents"
version = "0.1.0"
description = "RootCause Agents: multi-agent AI system that investigates production incidents and produces evidence-backed root-cause reports (LangGraph + OpenAI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "langfuse>=5.2.0",
    "streamlit>=1.67.0",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary]>=3.3.9",
    "psycopg-pool>=3.3.3",
]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootcause_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real OpenAI API (needs OPENAI_API_KEY)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # unicode dashes/arrows in user-facing strings are intentional
    "RUF002",
    "RUF003",
    "SIM108",
    "E501",    # long lines are allowed (prompts, tables); readability over wrapping
]
