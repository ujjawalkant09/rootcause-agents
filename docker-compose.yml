# Local Postgres for LangGraph checkpoints (persistent investigation sessions + human-in-the-loop).
# Start:  docker compose up -d      Stop: docker compose down      (data persists in the named volume)
services:
  postgres:
    image: postgres:16-alpine
    container_name: rootcause-postgres
    environment:
      POSTGRES_USER: rootcause
      POSTGRES_PASSWORD: rootcause   # local development only
      POSTGRES_DB: rootcause
    ports:
      - "5433:5432"                  # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - rootcause-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootcause -d rootcause"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  rootcause-pgdata:
